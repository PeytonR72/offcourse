name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        id: build
      - run: npx playwright install --with-deps chromium
      # Measure frame cadence without another emulated browser competing for CPU/GPU.
      # Preserve the test's existing p95/median budgets and saved raw measurements.
      - name: Verify isolated flight cadence
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-cadence
        run: npm run test:e2e -- tests/e2e/universe.spec.ts --workers=1 --output=test-results-cadence
      - name: Verify browser journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e -- --grep-invert "universe stays inside its scene"
      - name: Verify server play against isolated PostgreSQL
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          export PG_BIN="$(pg_config --bindir)"
          npm run test:e2e:server
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            playwright-report-cadence/
            test-results/
            test-results-cadence/
          retention-days: 14
